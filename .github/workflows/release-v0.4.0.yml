name: Release v0.4.0 portable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.4.0.yml'
      - 'Genre_test_START.cmd'
      - 'scripts/release_bootstrap.ps1'
      - 'PORTABLE_README.txt'
      - 'README_RU.txt'
      - 'README.md'
      - 'RELEASE_NOTES_0.4.0.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v0.4.0 source version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'version = "0.4.0"' pyproject.toml
          grep -Fq '__version__ = "0.4.0"' src/genre_test/__init__.py

      - name: Parse release PowerShell scripts
        shell: pwsh
        run: |
          foreach ($script in @(
            './scripts/ensure_winget.ps1',
            './scripts/ensure_vcredist.ps1',
            './scripts/release_bootstrap.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
            Write-Host "PowerShell parser PASS: $script"
          }

      - name: Verify v0.4 release runtime gates
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "\$torchVersion = '2.12.1'" scripts/release_bootstrap.ps1
          grep -Fq 'download.pytorch.org/whl/cu130' scripts/release_bootstrap.ps1
          grep -Fq 'download.pytorch.org/whl/cpu' scripts/release_bootstrap.ps1
          grep -Fq "@('-3.13', '-3.12', '-3.11')" scripts/release_bootstrap.ps1
          grep -Fq 'Win32_VideoController' scripts/release_bootstrap.ps1
          grep -Fq 'VEN_10DE' scripts/release_bootstrap.ps1
          grep -Fq 'torch.cuda.get_arch_list()' scripts/release_bootstrap.ps1
          grep -Fq 'blackwell = major in {10, 11, 12}' scripts/release_bootstrap.ps1
          grep -Fq 'Compatible PyTorch already present' scripts/release_bootstrap.ps1
          grep -Fq 'scripts\release_bootstrap.ps1' Genre_test_START.cmd
          if grep -Fq 'portable_bootstrap' Genre_test_START.cmd; then
            echo 'Retired portable bootstrap fallback is still present in launcher.' >&2
            exit 1
          fi

      - name: Build portable folder
        shell: bash
        run: |
          set -euo pipefail
          ROOT='dist/Genre_test_0.4.0_portable'
          mkdir -p "$ROOT/src" "$ROOT/scripts" "$ROOT/config"
          cp Genre_test_START.cmd "$ROOT/"
          cp README_RU.txt PORTABLE_README.txt RELEASE_NOTES_0.4.0.md "$ROOT/"
          cp pyproject.toml LICENSE README.md "$ROOT/"
          cp -R src/genre_test "$ROOT/src/"
          cp scripts/ensure_winget.ps1 "$ROOT/scripts/"
          cp scripts/ensure_vcredist.ps1 "$ROOT/scripts/"
          cp scripts/release_bootstrap.ps1 "$ROOT/scripts/"
          cp -R config/. "$ROOT/config/"
          printf 'Genre_test 0.4.0 portable release\nSource commit: %s\nPackage workflow: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$ROOT/VERSION.txt"
          (
            cd "$ROOT"
            find . -type f -print0 | sort -z | xargs -0 sha256sum > MANIFEST_SHA256.txt
          )
          cd dist
          zip -9 -r Genre_test_0.4.0_portable.zip Genre_test_0.4.0_portable
          sha256sum Genre_test_0.4.0_portable.zip > SHA256SUMS.txt

      - name: Inspect archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -t dist/Genre_test_0.4.0_portable.zip
          unzip -l dist/Genre_test_0.4.0_portable.zip | grep -Fq 'Genre_test_START.cmd'
          unzip -l dist/Genre_test_0.4.0_portable.zip | grep -Fq 'scripts/release_bootstrap.ps1'
          unzip -l dist/Genre_test_0.4.0_portable.zip | grep -Fq 'scripts/ensure_winget.ps1'
          unzip -l dist/Genre_test_0.4.0_portable.zip | grep -Fq 'scripts/ensure_vcredist.ps1'
          unzip -l dist/Genre_test_0.4.0_portable.zip | grep -Fq 'README_RU.txt'
          unzip -l dist/Genre_test_0.4.0_portable.zip | grep -Fq 'MANIFEST_SHA256.txt'
          test -s dist/Genre_test_0.4.0_portable.zip
          test -s dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Genre_test_0.4.0_portable
          path: |
            dist/Genre_test_0.4.0_portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.4.0 >/dev/null 2>&1; then
            gh release upload v0.4.0 dist/Genre_test_0.4.0_portable.zip dist/SHA256SUMS.txt --clobber
            gh release edit v0.4.0 --title 'Genre_test v0.4.0' --notes-file RELEASE_NOTES_0.4.0.md --target "$GITHUB_SHA"
          else
            gh release create v0.4.0 \
              --target "$GITHUB_SHA" \
              --title 'Genre_test v0.4.0' \
              --notes-file RELEASE_NOTES_0.4.0.md \
              dist/Genre_test_0.4.0_portable.zip \
              dist/SHA256SUMS.txt
          fi

      - name: Publish v0.4.0 files into repository releases folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          rm -f releases/Genre_test_*_portable.zip releases/SHA256SUMS.txt releases/RELEASE_NOTES_*.md
          cp dist/Genre_test_0.4.0_portable.zip releases/Genre_test_0.4.0_portable.zip
          cp dist/SHA256SUMS.txt releases/SHA256SUMS.txt
          cp RELEASE_NOTES_0.4.0.md releases/RELEASE_NOTES_0.4.0.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases
          if git diff --cached --quiet; then
            echo 'Repository release folder already current.'
          else
            git commit -m 'release: publish Genre_test 0.4.0 portable in repository [skip ci]'
            git push origin HEAD:main
          fi

      - name: Prune merged and retired branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          for ref in \
            'v0-3-6-portable-prerelease' \
            'v0-4-0-audio-profile-foundation' \
            'realise/13-first-run-bootstrap' \
            'realise/15-release-blockers' \
            'realise/17-v0-4-release' \
            'realise/19-repo-cleanup-docs' \
            'realise/19-repo-cleanup-final' \
            'realise/19-v0-4-legacy-cleanup' \
            'chore/final-branch-prune'
          do
            echo "Deleting merged/retired branch: $ref"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref" >/dev/null 2>&1 || true
          done
          exit 0
