name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-history:
    name: gitleaks-history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all repository refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'

      - name: Install Gitleaks v8.30.1
        shell: bash
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$GOBIN"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Scan all reachable Git history
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git --redact --verbose --log-opts="--all --full-history" .
