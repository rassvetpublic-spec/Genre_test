name: Obsidian materialize temporary

on:
  push:
    branches: [refactor/obsidian-p2-196]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/obsidian-p2-196
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate deterministic Obsidian projections
        run: python tools/obsidian_knowledge_sync.py --write
      - name: Commit generated projections to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git add docs/obsidian/KNOWLEDGE_INDEX.md \
                  docs/obsidian/REPOSITORY_INVENTORY.json \
                  docs/obsidian/HOME.md \
                  docs/obsidian/KNOWLEDGE_ANALYTICS.md \
                  docs/obsidian/KNOWLEDGE.base \
                  docs/obsidian/RELATIONS.base \
                  docs/obsidian/TERMS.base
          if git diff --cached --quiet; then
            echo 'No projection changes to materialize.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: rematerialize Obsidian projections [materialized]'
          git push origin HEAD:refactor/obsidian-p2-196
