name: Workstation P1 integrate temporary

on:
  push:
    branches:
      - refactor/workstation-p1-164

permissions:
  contents: write

concurrency:
  group: workstation-p1-integrate-temp
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/workstation-p1-164
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Register Workstation P1 knowledge owner
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/obsidian/KNOWLEDGE_REGISTRY.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          entry = {
              'path': 'docs/WORKSTATION_P1.md',
              'title': 'Genre_test Workstation P1 Contract',
              'doc_type': 'protocol',
              'area': 'project',
              'status': 'active',
              'summary': 'P1 contract for the localhost-only Workstation shell, RU/EN foundation, lightweight local API and canonical Resource Monitor adapter.',
              'tags': ['область/project', 'тип/protocol', 'статус/active'],
              'terms': ['Workstation', 'localhost', 'RU/EN', 'Resource Monitor', 'job facade'],
              'depends_on': ['docs/SUPERCOMBINE_UI_ARCHITECTURE.md'],
              'related': ['README.md', 'ROADMAP.md'],
          }
          entries = data['entries']
          if not any(item['path'] == entry['path'] for item in entries):
              entries.append(entry)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python tools/obsidian_knowledge_sync.py --write
          python tools/check_markdown_authoring.py
          python tools/obsidian_knowledge_sync.py --check
          python -m pip install pytest
          python -m pip install -e . --no-deps
          python -m pytest -q tests/test_workstation_entrypoint.py tests/test_workstation_p1.py tests/test_obsidian_p2_qa_findings.py
      - name: Commit integration
        run: |
          git add docs/obsidian docs/WORKSTATION_P1.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: register Workstation P1 in Obsidian knowledge layer'
          fi
          git push origin HEAD:refactor/workstation-p1-164
