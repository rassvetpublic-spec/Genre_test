name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test environment
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff numpy librosa typer rich soundfile
          pip install -e . --no-deps
      - name: CLI version smoke
        run: genre-test --version
      - name: Python support metadata gate
        shell: bash
        run: |
          grep -Fq 'requires-python = ">=3.11,<3.14"' pyproject.toml
          python -c "import sys; assert sys.version_info[:2] in {(3,11),(3,12),(3,13)}"
          echo 'Python 3.11-3.13 metadata gate PASS'
      - name: Root launcher auto-mode gate
        shell: bash
        run: |
          grep -Fq 'if exist "%ROOT%.git" set "MODE=WORKING"' Genre_test_START.cmd
          grep -Fq 'Mode   : Git working tree' Genre_test_START.cmd
          grep -Fq 'Mode   : packaged release' Genre_test_START.cmd
          grep -Fq 'findstr /b /c:"version = "' Genre_test_START.cmd
          grep -Fq 'launcher_pyproject.stamp' Genre_test_START.cmd
          grep -Fq '%%~zF_%%~tF' Genre_test_START.cmd
          grep -Fq '.venv\Scripts\genre-test-gui.exe' Genre_test_START.cmd
          grep -Fq 'scripts\release_bootstrap.ps1' Genre_test_START.cmd
          grep -Fq 'if /I "%VERSION%"=="0.3.6"' Genre_test_START.cmd
          grep -Fq 'accepted only for 0.3.6' Genre_test_START.cmd
          grep -Fq 'setup.ps1" -InstallPython' Genre_test_START.cmd
          grep -Fq 'Microsoft.PowerShell' Genre_test_START.cmd
          grep -Fq 'ensure_winget.ps1' Genre_test_START.cmd
          grep -Fq 'Python 3.11/3.12/3.13 x64' Genre_test_START.cmd
          if grep -Fq 'Get-FileHash' Genre_test_START.cmd; then
            echo 'Root launcher still shells through PowerShell for its fingerprint.' >&2
            exit 1
          fi
          if grep -Fq 'set "EXPECTED=C:\Genre_test_0.3.6_portable\"' Genre_test_START.cmd; then
            echo 'Root launcher still contains frozen 0.3.6 path gate.' >&2
            exit 1
          fi
          echo 'universal root launcher + first-run bootstrap gate PASS'
      - name: PowerShell setup/release parser and CUDA 13 gate
        shell: pwsh
        run: |
          foreach ($script in @('./scripts/setup.ps1', './scripts/release_bootstrap.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
            Write-Host "PowerShell parser PASS: $script"
          }
          $setup = Get-Content './scripts/setup.ps1' -Raw
          if ($setup -notmatch 'torch==\$TorchVersion' -or $setup -notmatch 'whl/cu130') {
            throw 'v0.4 setup does not pin the CUDA 13.0 PyTorch path.'
          }
          if ($setup -notmatch 'Refresh-ProcessPath' -or $setup -notmatch 'Get-WingetPath') {
            throw 'First-run setup does not refresh PATH / recover WinGet.'
          }
          if ($setup -notmatch "'-3\.13'" -or $setup -notmatch '11\|12\|13') {
            throw 'First-run setup does not accept/prefer Python 3.13 x64.'
          }
          if ($setup -notmatch 'Python\.Python\.3\.12' -or $setup -notmatch '--architecture x64') {
            throw 'First-run fallback does not enforce automatic Python 3.12 x64 installation.'
          }
          $release = Get-Content './scripts/release_bootstrap.ps1' -Raw
          if ($release -notmatch "torchVersion = '2\.12\.1'" -or $release -notmatch 'whl/cu130' -or $release -notmatch 'whl/cpu') {
            throw 'v0.4 release bootstrap does not pin Torch 2.12.1 / cu130 / CPU routes.'
          }
          if ($release -notmatch 'Win32_VideoController' -or $release -notmatch 'VEN_10DE' -or $release -notmatch 'torch\.cuda\.get_arch_list') {
            throw 'v0.4 release bootstrap is missing NVIDIA PnP/native architecture gates.'
          }
          Write-Host 'setup/release parser/CUDA13/Python3.13 gate PASS'
      - name: FFmpeg bootstrap script smoke
        shell: pwsh
        run: ./scripts/ensure_ffmpeg.ps1 -NoInstall
      - name: Ruff
        run: ruff check src tests
      - name: Tests
        run: pytest -q
