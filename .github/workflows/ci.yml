name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test environment
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff numpy librosa typer rich soundfile
          pip install -e . --no-deps
      - name: Development version gate
        shell: bash
        run: |
          grep -Fq 'version = "0.5.0.dev0"' pyproject.toml
          grep -Fq '__version__ = "0.5.0.dev0"' src/genre_test/__init__.py
          test "$(genre-test --version)" = "Genre_test 0.5.0.dev0"
          echo 'v0.5 development version gate PASS'
      - name: Python support metadata gate
        shell: bash
        run: |
          grep -Fq 'requires-python = ">=3.11,<3.14"' pyproject.toml
          python -c "import sys; assert sys.version_info[:2] in {(3,11),(3,12),(3,13)}"
          echo 'Python 3.11-3.13 metadata gate PASS'
      - name: Root launcher auto-mode gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'if exist "%ROOT%.git" set "MODE=WORKING"' Genre_test_START.cmd
          grep -Fq 'Mode   : Git working tree' Genre_test_START.cmd
          grep -Fq 'Mode   : packaged release' Genre_test_START.cmd
          grep -Fq 'findstr /b /c:"version = "' Genre_test_START.cmd
          grep -Fq 'launcher_pyproject.stamp' Genre_test_START.cmd
          grep -Fq '%%~zF_%%~tF' Genre_test_START.cmd
          grep -Fq '.venv\Scripts\genre-test-gui.exe' Genre_test_START.cmd
          grep -Fq 'scripts\release_bootstrap.ps1' Genre_test_START.cmd
          grep -Fq 'setup.ps1" -InstallPython' Genre_test_START.cmd
          grep -Fq 'Microsoft.PowerShell' Genre_test_START.cmd
          grep -Fq 'ensure_winget.ps1' Genre_test_START.cmd
          grep -Fq 'Python 3.11/3.12/3.13 x64' Genre_test_START.cmd
          grep -Fq 'retrieval-status' Genre_test_START.cmd
          grep -Fq 'retrieval-setup' Genre_test_START.cmd
          grep -Fq 'retrieval-smoke' Genre_test_START.cmd
          grep -Fq 'retrieval-direct-smoke' Genre_test_START.cmd
          if grep -Eq 'CC-BY-NC-4\.0|MERT_ACCEPT|Type YES' Genre_test_START.cmd; then
            echo 'Development launcher still contains the deferred interactive license prompt.' >&2
            exit 1
          fi
          grep -Fq 'development setup prompt deferred' scripts/setup_clamp3_runtime.ps1
          grep -Fq 'Internal scripts under scripts\ are implementation details' Genre_test_START.cmd
          grep -Fq '.\Genre_test_START.cmd retrieval-setup' docs/CLAMP3_RUNTIME_P0.md
          if grep -Fq 'pwsh -File .\scripts\setup_clamp3_runtime.ps1' docs/CLAMP3_RUNTIME_P0.md; then
            echo 'CLaMP runtime docs bypass the unified root launcher.' >&2
            exit 1
          fi
          if grep -Fq 'portable_bootstrap' Genre_test_START.cmd; then
            echo 'Root launcher still contains retired portable bootstrap fallback.' >&2
            exit 1
          fi
          if grep -Fq '0.3.6' Genre_test_START.cmd; then
            echo 'Root launcher still contains retired 0.3.6 semantics.' >&2
            exit 1
          fi
          if grep -Fq 'Get-FileHash' Genre_test_START.cmd; then
            echo 'Root launcher still shells through PowerShell for its fingerprint.' >&2
            exit 1
          fi
          echo 'universal launcher + unified retrieval entry point gate PASS'
      - name: Legacy retirement gate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/portable-prerelease.yml
          test ! -e scripts/portable_bootstrap.ps1
          test ! -e scripts/portable_bootstrap_v2.ps1
          test ! -e scripts/upgrade-v0.2.ps1
          if find releases -maxdepth 1 -type f -name '*0.3.6*' | grep -q .; then
            echo 'Retired 0.3.6 release files remain in releases/.' >&2
            exit 1
          fi
          test ! -e .github/workflows/release-v0.4.0.yml
          test ! -e RELEASE_NOTES_0.4.0.md
          test ! -e releases/Genre_test_0.4.0_portable.zip
          test ! -e releases/RELEASE_NOTES_0.4.0.md
          echo 'retired release artifact gate PASS'
      - name: PowerShell setup/release/regression/retrieval parser and CUDA 13 gate
        shell: pwsh
        run: |
          foreach ($script in @(
            './scripts/setup.ps1',
            './scripts/release_bootstrap.ps1',
            './scripts/run_large_regression.ps1',
            './scripts/run_local_retrieval_p0_tests.ps1',
            './scripts/setup_clamp3_runtime.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
            Write-Host "PowerShell parser PASS: $script"
          }
          $setup = Get-Content './scripts/setup.ps1' -Raw
          if ($setup -notmatch 'torch==\$TorchVersion' -or $setup -notmatch 'whl/cu130') {
            throw 'Current setup does not pin the CUDA 13.0 PyTorch path.'
          }
          if ($setup -notmatch 'Refresh-ProcessPath' -or $setup -notmatch 'Get-WingetPath') {
            throw 'First-run setup does not refresh PATH / recover WinGet.'
          }
          if ($setup -notmatch "'-3\.13'" -or $setup -notmatch '11\|12\|13') {
            throw 'First-run setup does not accept/prefer Python 3.13 x64.'
          }
          if ($setup -notmatch 'Python\.Python\.3\.12' -or $setup -notmatch '--architecture x64') {
            throw 'First-run fallback does not enforce automatic Python 3.12 x64 installation.'
          }
          $release = Get-Content './scripts/release_bootstrap.ps1' -Raw
          if ($release -notmatch "torchVersion = '2\.12\.1'" -or $release -notmatch 'whl/cu130' -or $release -notmatch 'whl/cpu') {
            throw 'Current release bootstrap does not pin Torch 2.12.1 / cu130 / CPU routes.'
          }
          if ($release -notmatch 'Win32_VideoController' -or $release -notmatch 'VEN_10DE' -or $release -notmatch 'torch\.cuda\.get_arch_list') {
            throw 'Current release bootstrap is missing NVIDIA PnP/native architecture gates.'
          }
          $clampSetup = Get-Content './scripts/setup_clamp3_runtime.ps1' -Raw
          if ($clampSetup -notmatch '9016d2b0c8d12d1aa79c2e0ab201e6822bdc83a8' -or $clampSetup -notmatch '2\.12\.1' -or $clampSetup -notmatch 'cu130') {
            throw 'CLaMP sidecar bootstrap is missing the selected code/runtime pins.'
          }
          if ($clampSetup -notmatch 'AcceptMertNonCommercialTerms' -or $clampSetup -notmatch 'CC-BY-NC-4\.0') {
            throw 'CLaMP sidecar bootstrap is missing the explicit MERT license gate.'
          }
          if ($clampSetup -match 'print\(sys\.executable\)' -or $clampSetup -notmatch '\$python312 = @\(Get-Python312\)') {
            throw 'CLaMP Python launcher probe can leak native stdout into venv launcher arguments.'
          }
          if ($clampSetup -match 'torchaudio==\$TorchVersion' -or $clampSetup -notmatch 'scipy==1\.13\.1') {
            throw 'CLaMP bootstrap must use the pinned SciPy resampler without a mismatched torchaudio wheel.'
          }
          Write-Host 'setup/release/regression/retrieval parser/CUDA13/Python3.13 gate PASS'
      - name: Pinned retrieval manifest smoke
        shell: bash
        run: |
          set -euo pipefail
          python scripts/clamp3_runtime_smoke.py --manifest > clamp3_manifest.json
          grep -Fq '"weight_variant": "saas"' clamp3_manifest.json
          grep -Fq '5033f868e3977be3945ee416b5a1718d5589a173c7ba8982231d8c94a6441d80' clamp3_manifest.json
          grep -Fq '55fa29e5522049926c03d2ff9ae54d22c20e668f' clamp3_manifest.json
          grep -Fq 'e73636d4f797dec63c3081bb6ed5c7b0bb3f2089' clamp3_manifest.json
          echo 'pinned CLaMP/MERT/XLM-R manifest PASS'
      - name: FFmpeg bootstrap script smoke
        shell: pwsh
        run: ./scripts/ensure_ffmpeg.ps1 -NoInstall
      - name: Ruff
        run: ruff check src tests
      - name: Tests
        run: pytest -q
