name: Encoding Policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  utf8:
    name: utf8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository encodings
        run: python tools/check_encoding.py
