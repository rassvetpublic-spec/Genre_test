name: Portable prerelease 0.3.6

on:
  push:
    branches:
      - v0-3-6-portable-prerelease
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    if: github.event_name != 'pull_request' || github.head_ref == 'v0-3-6-portable-prerelease'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen prerelease version
        shell: bash
        run: |
          grep -q '__version__ = "0.3.6"' src/genre_test/__init__.py
          grep -q 'version = "0.3.6"' pyproject.toml

      - name: Parse portable PowerShell bootstrap
        shell: pwsh
        run: |
          foreach ($script in @(
            './scripts/ensure_winget.ps1',
            './scripts/ensure_vcredist.ps1',
            './scripts/portable_bootstrap_v2.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
            Write-Host "PowerShell parser PASS: $script"
          }

      - name: Verify clean Windows recovery paths
        shell: bash
        run: |
          grep -q 'Microsoft.WinGet.Client' scripts/ensure_winget.ps1
          grep -q 'Repair-WinGetPackageManager' scripts/ensure_winget.ps1
          grep -Fq 'Microsoft.VCRedist.2015+.x64' scripts/ensure_vcredist.ps1
          grep -Fq 'C:\Genre_test_0.3.6_portable\' Genre_test_START.cmd
          grep -q 'ensure_winget.ps1' Genre_test_START.cmd
          grep -q 'ensure_vcredist.ps1' Genre_test_START.cmd
          grep -q 'portable_bootstrap_v2.ps1' Genre_test_START.cmd
          grep -Fq "'numpy>=1.26,<3'" scripts/portable_bootstrap_v2.ps1
          grep -q '__GENRE_TEST_TORCH_OK__' scripts/portable_bootstrap_v2.ps1
          grep -q 'pip install -e .*| Out-Host' scripts/portable_bootstrap_v2.ps1
          grep -Fq '& $Python -c $healthCode | Out-Host' scripts/portable_bootstrap_v2.ps1

      - name: Build portable folder
        shell: bash
        run: |
          set -euo pipefail
          ROOT="dist/Genre_test_0.3.6_portable"
          mkdir -p "$ROOT/src" "$ROOT/scripts" "$ROOT/config"
          cp Genre_test_START.cmd "$ROOT/"
          cp README_RU.txt "$ROOT/"
          cp PORTABLE_README.txt "$ROOT/"
          cp pyproject.toml LICENSE README.md "$ROOT/"
          cp -R src/genre_test "$ROOT/src/"
          cp scripts/ensure_winget.ps1 "$ROOT/scripts/"
          cp scripts/ensure_vcredist.ps1 "$ROOT/scripts/"
          cp scripts/portable_bootstrap_v2.ps1 "$ROOT/scripts/"
          cp -R config/. "$ROOT/config/"
          printf 'Genre_test 0.3.6 portable prerelease\nRequired path: C:\\Genre_test_0.3.6_portable\nSource main: 06afdc5cb4d940797e514873e34b737ef0250540\nPackage commit: %s\n' "$GITHUB_SHA" > "$ROOT/VERSION.txt"
          (
            cd "$ROOT"
            find . -type f -print0 | sort -z | xargs -0 sha256sum > MANIFEST_SHA256.txt
          )
          cd dist
          zip -9 -r Genre_test_0.3.6_portable.zip Genre_test_0.3.6_portable
          sha256sum Genre_test_0.3.6_portable.zip > SHA256SUMS.txt

      - name: Inspect archive
        shell: bash
        run: |
          unzip -t dist/Genre_test_0.3.6_portable.zip
          unzip -l dist/Genre_test_0.3.6_portable.zip | grep -q 'README_RU.txt'
          unzip -l dist/Genre_test_0.3.6_portable.zip | grep -q 'Genre_test_START.cmd'
          unzip -l dist/Genre_test_0.3.6_portable.zip | grep -q 'scripts/ensure_winget.ps1'
          unzip -l dist/Genre_test_0.3.6_portable.zip | grep -q 'scripts/ensure_vcredist.ps1'
          unzip -l dist/Genre_test_0.3.6_portable.zip | grep -q 'scripts/portable_bootstrap_v2.ps1'
          test -s dist/Genre_test_0.3.6_portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Genre_test_0.3.6_portable
          path: |
            dist/Genre_test_0.3.6_portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish ready-to-share ZIP into repository releases folder
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cp dist/Genre_test_0.3.6_portable.zip releases/Genre_test_0.3.6_portable.zip
          cp dist/SHA256SUMS.txt releases/SHA256SUMS.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/Genre_test_0.3.6_portable.zip releases/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'Release files already current.'
            exit 0
          fi
          git commit -m 'release: refresh Genre_test 0.3.6 portable [skip ci]'
          git push origin HEAD:v0-3-6-portable-prerelease
