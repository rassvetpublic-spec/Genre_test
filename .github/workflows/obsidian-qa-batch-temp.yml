name: Obsidian QA batch temporary

on:
  push:
    branches:
      - refactor/obsidian-p2-196

permissions:
  contents: write

concurrency:
  group: obsidian-qa-batch-temp
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/obsidian-p2-196
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply QA findings batch
        run: |
          python tools/_apply_obsidian_p2_qa_batch.py
          python tools/obsidian_knowledge_sync.py --write
          python tools/check_markdown_authoring.py
          python tools/obsidian_knowledge_sync.py --check
          python -m pytest -q tests/test_obsidian_knowledge_sync.py tests/test_obsidian_p2_qa_findings.py
      - name: Commit generated fix batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/obsidian_knowledge_sync.py docs/obsidian tests/test_obsidian_p2_qa_findings.py
          if git diff --cached --quiet; then
            echo 'No QA batch changes to commit.'
            exit 0
          fi
          git commit -m 'fix: address Obsidian P2 review findings [qa-batch]'
          git push origin HEAD:refactor/obsidian-p2-196
