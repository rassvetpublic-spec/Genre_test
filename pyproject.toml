[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "genre-test"
version = "0.5.0.dev0"
description = "Local ensemble music analyzer with MAEST genre classification, AudioSet semantic profiling, history and validation lab."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "rassvetpublic"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "soundfile>=0.12.1,<1",
  "librosa>=0.10.2,<1",
  "torch>=2.12.1,<3",
  "transformers>=4.48,<6",
  "accelerate>=1.2,<2",
  "safetensors>=0.4.5,<1",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "pydantic>=2.10,<3",
  "psutil>=6.1,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
genre-test = "genre_test.cli:app"
genre-test-gui = "genre_test.desktop_gui:main"
genre-test-retrieval = "genre_test.retrieval.entrypoint:main"
genre-test-db-recovery = "genre_test.db_recovery:main"
genre-test-mastering-qc = "genre_test.technical.mastering_cli:main"
genre-test-ozone-xml = "genre_test.mastering.ozone12.xml_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genre_test"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/genre_test/cli.py" = ["B008"]
"src/genre_test/gui.py" = ["BLE001"]
"src/genre_test/validation_gui.py" = ["BLE001"]
"src/genre_test/themed_gui.py" = ["B010"]
"src/genre_test/retrieval/cli.py" = ["B009"]
"src/genre_test/retrieval/segments.py" = ["B008"]