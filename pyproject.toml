[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "genre-test"
version = "0.4.0"
description = "Local ensemble music analyzer with MAEST genre classification, AudioSet semantic profiling, history and validation lab."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "rassvetpublic"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "soundfile>=0.12.1,<1",
  "librosa>=0.10.2,<1",
  "torch>=2.12.1,<3",
  "transformers>=4.48,<6",
  "accelerate>=1.2,<2",
  "safetensors>=0.4.5,<1",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
genre-test = "genre_test.cli:app"
genre-test-gui = "genre_test.runtime_health_gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genre_test"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/genre_test/cli.py" = ["B008"]
"src/genre_test/gui.py" = ["BLE001"]
"src/genre_test/validation_gui.py" = ["BLE001"]
